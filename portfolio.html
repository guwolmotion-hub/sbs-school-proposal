<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>포트폴리오 | SBS아카데미컴퓨터아트학원 구월지점</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{--navy:#0f1f3d;--blue:#1d3d6e;--accent:#3a7bd5;--bg:#f0f4fa;--card:#fff;--border:#e0e6f0;--text:#1a2540;--sub:#6b7a99;--sw:256px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
/* SIDEBAR */
.sb{width:var(--sw);min-height:100vh;background:linear-gradient(180deg,#080f1e 0%,#0d1a30 60%,#0f2040 100%);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;overflow-y:auto}
.sb-brand{padding:26px 20px 22px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logo{display:flex;align-items:center;gap:11px;margin-bottom:5px}
.sb-logo-mark{width:40px;height:40px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.5px}
.sb-logo-text{font-size:12px;font-weight:800;color:#fff;line-height:1.4}
.sb-point{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px}
.sb-sec{padding:18px 20px 8px;font-size:10px;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:1.8px;text-transform:uppercase}
.sb-items{padding:0 10px 10px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:all .18s;text-decoration:none;margin-bottom:1px}
.sb-item:hover{background:rgba(255,255,255,.07)}
.sb-item.active{background:rgba(58,123,213,.25)}
.sb-item-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sb-item-name{font-size:13px;font-weight:500;color:rgba(255,255,255,.65)}
.sb-item:hover .sb-item-name,.sb-item.active .sb-item-name{color:#fff}
.sb-foot{margin-top:auto;padding:16px 10px;border-top:1px solid rgba(255,255,255,.07)}
.sb-foot-link{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;color:rgba(255,255,255,.45);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:all .18s;margin-bottom:2px}
.sb-foot-link:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
/* MAIN */
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:13px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 8px rgba(15,31,61,.05)}
.content{padding:28px 32px 64px;flex:1}
/* HERO */
.hero-main{border-radius:14px;background:linear-gradient(160deg,#0a1628 0%,#0f2245 100%);padding:32px 36px;margin-bottom:20px;box-shadow:0 4px 20px rgba(10,22,40,.15)}
.hero-glow{position:absolute;top:-60px;right:-30px;width:280px;height:280px;background:radial-gradient(circle,rgba(58,123,213,.22),transparent 65%);pointer-events:none}
.hero-badge{display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:3px 10px;font-size:10px;font-weight:700;color:rgba(255,255,255,.6);margin-bottom:12px;letter-spacing:1.5px;text-transform:uppercase}
.hero-title-main{font-size:26px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:8px}
.hero-title-main em{font-style:normal;color:#60a5fa}
.hero-sub-main{font-size:13px;color:rgba(255,255,255,.55);line-height:1.8}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;border:none;border-radius:10px;padding:8px 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#2d6bc4;box-shadow:0 4px 12px rgba(58,123,213,.35)}
.btn-ghost{background:rgba(255,255,255,.13);color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.22)}.btn-ghost:hover{background:rgba(255,255,255,.22)}
.btn-outline{background:var(--card);color:var(--sub);border:1px solid var(--border)}.btn-outline:hover{color:var(--accent);border-color:var(--accent);background:#eaf3ff}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:8px}
/* WRAP */
.wrap{max-width:1200px;margin:0 auto;padding:0}
/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:12px;border:2px solid var(--border);background:var(--card);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--sub)}
.tab.ta{background:linear-gradient(135deg,#1d3d6e,#3a7bd5);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(58,123,213,.3)}
.tcnt{display:inline-block;background:rgba(255,255,255,.25);border-radius:20px;padding:1px 9px;font-size:12px;margin-left:5px}
.tab:not(.ta) .tcnt{background:var(--bg);color:var(--sub)}
/* GALLERY GRID */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gallery-item{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#1a2540;cursor:pointer;box-shadow:0 4px 18px rgba(15,31,61,.18);transition:box-shadow .25s}
.gallery-item:hover{box-shadow:0 8px 32px rgba(15,31,61,.28)}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.gallery-item:hover img{transform:scale(1.06)}
.gallery-vbg{width:100%;height:100%;background:linear-gradient(135deg,#0f1f3d,#1d3d6e);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.gallery-vbg .gv-play{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.gallery-vbg .gv-title{font-size:12px;color:rgba(255,255,255,.5);padding:0 12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%}
/* GALLERY OVERLAY (hover) */
.gallery-overlay{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.88));opacity:0;transition:opacity .25s;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.gallery-item:hover .gallery-overlay{opacity:1}
.g-title{color:#fff;font-size:14px;font-weight:600;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-meta{display:flex;align-items:center;justify-content:space-between}
.g-cat{background:rgba(255,255,255,.18);backdrop-filter:blur(4px);border-radius:20px;padding:2px 10px;font-size:11px;color:rgba(255,255,255,.85);font-weight:600}
.g-del{background:rgba(220,38,38,.75);color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.g-del:hover{background:rgba(220,38,38,1)}
/* PLAY ICON for videos */
.g-play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 20px rgba(0,0,0,.35);pointer-events:none;transition:transform .25s,opacity .25s}
.gallery-item:hover .g-play-icon{transform:translate(-50%,-50%) scale(1.12);opacity:.95}
/* EMPTY */
.empty{text-align:center;padding:80px 20px;color:var(--sub)}
.empty-icon{width:56px;height:56px;border-radius:50%;background:var(--border);margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.empty span{font-size:15px;display:block;margin-bottom:20px}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,31,61,.52);backdrop-filter:blur(5px);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:20px;width:500px;max-width:94vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(15,31,61,.3);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
.modal-hd{padding:20px 22px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-hd h3{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--sub);line-height:1;padding:2px 6px}
.modal-body{padding:18px 22px}
.modal-foot{padding:0 22px 18px;display:flex;justify-content:flex-end;gap:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
.field input,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;background:#fafbfe}
.field input:focus,.field select:focus{border-color:var(--accent);background:#fff}
/* TYPE TOGGLE */
.type-toggle{display:flex;gap:8px;margin-bottom:16px}
.type-btn{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--sub)}
.type-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* UPLOAD AREA */
.upload-area{position:relative;border:2px dashed var(--border);border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .2s;background:#fafbfe}
.upload-area:hover,.upload-area.drag{border-color:var(--accent);background:#eaf3ff}
.upload-area input[type=file]{display:none}
.ua-icon{font-size:20px;margin-bottom:5px;color:var(--sub)}
.ua-text{font-size:13px;color:var(--sub);font-weight:500}
.ua-sub{font-size:11px;color:var(--sub);margin-top:2px;opacity:.65}
.upload-preview{width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-top:10px;display:none}
/* DIVIDER */
.divider-or{text-align:center;color:var(--sub);font-size:12px;margin:12px 0;position:relative}
.divider-or::before,.divider-or::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:var(--border)}
.divider-or::before{left:0}.divider-or::after{right:0}
/* LIGHTBOX */
.lb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:500;display:none;align-items:center;justify-content:center}
.lb-overlay.open{display:flex}
.lb-topbar{position:absolute;top:0;left:0;right:0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.65),transparent);z-index:10;gap:10px}
.lb-titlewrap{display:flex;align-items:center;gap:8px;min-width:0}
.lb-title{color:#fff;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-cat{background:rgba(255,255,255,.15);border-radius:20px;padding:2px 11px;font-size:11px;color:rgba(255,255,255,.8);font-weight:600;flex-shrink:0}
.lb-close-btn{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:20px;cursor:pointer;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.lb-close-btn:hover{background:rgba(255,255,255,.25)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;font-size:36px;cursor:pointer;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;transition:background .2s;z-index:10;line-height:1;padding-bottom:2px}
.lb-nav:hover{background:rgba(255,255,255,.25)}
#lb-prev{left:16px}#lb-next{right:16px}
.lb-center{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:60px 80px 50px}
#lb-content{display:flex;align-items:center;justify-content:center;max-width:100%;max-height:100%}
#lb-content img{max-width:90vw;max-height:85vh;object-fit:contain;display:block;border-radius:2px}
#lb-content video{max-width:90vw;max-height:85vh;background:#000;display:block}
.yt-lb{width:min(90vw,1140px);aspect-ratio:16/9}
.yt-lb iframe{width:100%;height:100%;border:none;display:block}
.lb-bottom{position:absolute;bottom:0;left:0;right:0;padding:14px 20px;background:linear-gradient(transparent,rgba(0,0,0,.55));text-align:center;z-index:10}
.lb-counter{color:rgba(255,255,255,.4);font-size:13px}
/* BEST */
.best-section-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.best-badge-label{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.5px}
.best-count{font-size:12px;color:var(--sub);font-weight:500}
.best-grid{margin-bottom:24px}
.best-grid .gallery-item{box-shadow:0 4px 22px rgba(245,158,11,.22)}
.g-best-badge{position:absolute;top:8px;left:8px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.5px;z-index:2;pointer-events:none}
.g-star{background:rgba(255,255,255,.15);color:rgba(255,255,255,.55);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;line-height:1}
.g-star.on{background:rgba(245,158,11,.85);color:#fff}
.g-star:hover{background:rgba(245,158,11,.6);color:#fff}
.g-edit{background:rgba(58,123,213,.75);color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.g-edit:hover{background:rgba(58,123,213,1)}
.sec-divider{display:flex;align-items:center;gap:12px;margin:20px 0 18px;color:var(--sub);font-size:12px;font-weight:600;letter-spacing:.3px}
.sec-divider::before,.sec-divider::after{content:'';flex:1;height:1px;background:var(--border)}
/* TOAST */
#toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(15,31,61,.3);z-index:600;display:none;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
/* LOADING OVERLAY */
#loading-overlay{position:fixed;inset:0;background:rgba(15,31,61,.92);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:#3a7bd5;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:rgba(255,255,255,.7);font-size:14px;font-weight:500}
@media(max-width:960px){:root{--sw:210px}.content{padding:20px 20px 52px}}
@media(max-width:700px){
  .sb{display:none}.main{margin-left:0}.content{padding:16px 14px 48px}
  .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .lb-center{padding:50px 50px 40px}
  .lb-nav{width:42px;height:42px;font-size:28px}
  #lb-prev{left:6px}#lb-next{right:6px}
}
@media print{nav,.sb{display:none!important}.main{margin-left:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<aside class="sb" id="sidebar">
  <div class="sb-brand">
    <div class="sb-logo">
      <div class="sb-logo-mark">S</div>
      <div class="sb-logo-text">SBS아카데미<br>컴퓨터아트학원</div>
    </div>
    <div class="sb-point">구월지점</div>
  </div>
  <div class="sb-sec">카테고리</div>
  <div class="sb-items" id="sb-cat-list"></div>
  <div class="sb-foot">
    <a href="main.html" class="sb-foot-link">홈</a>
    <a href="students.html" class="sb-foot-link">수강생 관리</a>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div style="font-size:13px;color:var(--sub);font-weight:600">포트폴리오</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="today" style="font-size:13px;color:var(--sub);font-weight:500"></span>
      <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 작업물 추가</button>
    </div>
  </div>
  <div class="content">
    <div class="hero-main">
      <div class="hero-badge">포트폴리오</div>
      <div class="hero-title-main">포트폴리오 <em>갤러리</em></div>
      <div class="hero-sub-main">수강생 작업물을 학과별로 모아보세요</div>
    </div>
    <div id="app"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<div id="lightbox" class="lb-overlay">
  <div class="lb-topbar">
    <div class="lb-titlewrap">
      <span id="lb-title" class="lb-title"></span>
      <span id="lb-cat" class="lb-cat"></span>
    </div>

</div>

<div id="toast"></div>
<div id="loading-overlay"><div class="loading-spinner"></div><div class="loading-text">Firebase 데이터 로딩 중...</div></div>

<script>
var CATS=['전체','영상/모션2D','영상/모션3D','시각편집','아트웍','인테리어','CG/마야','웹'];

(function(){try{firebase.initializeApp(FIREBASE_CONFIG);}catch(e){if(!/already exists/.test(e.message))throw e;}})();
var _db=firebase.firestore();
var _storage=null;try{_storage=firebase.storage();}catch(e){console.warn('Storage 비활성화됨');}

var DB={
  _cache:null,
  get:function(){return this._cache?JSON.parse(JSON.stringify(this._cache)):{items:[]};},
  save:function(d){
    if(!this._cache){this._cache=d;return d;}
    var prev=this._cache.items||[];
    this._cache=d;
    var cur=d.items||[];
    var changed=cur.filter(function(it){var o=prev.find(function(x){return x.id===it.id;});return!o||JSON.stringify(o)!==JSON.stringify(it);});
    var deleted=prev.filter(function(it){return!cur.find(function(x){return x.id===it.id;});});
    changed.forEach(function(it){_db.collection('sbs_portfolio').doc(it.id).set(JSON.parse(JSON.stringify(it))).catch(function(){showToast('저장 오류');});});
    deleted.forEach(function(it){_db.collection('sbs_portfolio').doc(it.id).delete().catch(console.error);});
    return d;
  },
  load:async function(){
    var snapshot=await _db.collection('sbs_portfolio').get();
    if(snapshot.empty){
      var data={items:[]};
      var ls=localStorage.getItem('sbs_portfolio_v1');
      if(ls){
        try{
          var lsData=JSON.parse(ls);
          var all=lsData.items||[];
          data.items=all.filter(function(it){return it.url&&!it.url.startsWith('data:');});
          if(data.items.length<all.length)showToast('파일 업로드 항목은 Firestore 이전 불가 (URL 항목만 이전됨)',5000);
        }catch(e){data={items:[]};}
      }
      this._cache=data;
      if(data.items.length>0){
        var batch=_db.batch();
        data.items.forEach(function(it){batch.set(_db.collection('sbs_portfolio').doc(it.id),JSON.parse(JSON.stringify(it)));});
        await batch.commit();
      }
    }else{
      this._cache={items:snapshot.docs.map(function(d){return d.data();})};
    }
    return this._cache;
  }
};

var TAB='전체';
var UPLOAD_TYPE='image';
var LB_ITEMS=[];
var LB_IDX=0;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ytId(url){var m=String(url||'').match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/);return m?m[1]:null;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function showToast(msg,ms){if(!ms)ms=2500;var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none';},ms);}

function renderApp(){
  var d=DB.get();
  var all=d.items||[];
  var list=TAB==='전체'?all:all.filter(function(x){return x.category===TAB;});
  var counts={};
  for(var i=0;i<CATS.length;i++){var c=CATS[i];counts[c]=c==='전체'?all.length:all.filter(function(x){return x.category===c;}).length;}
  var tabsHtml='';
  for(var i=0;i<CATS.length;i++){var c=CATS[i];tabsHtml+='<button class="tab '+(TAB===c?'ta':'')+'" onclick="setTab(\''+esc(c)+'\')">'+esc(c)+'<span class="tcnt">'+counts[c]+'</span></button>';}
  var contentHtml='';
  if(list.length>0){
    var bestItems=list.filter(function(x){return x.best;}).slice(0,10);
    var regularItems=list.filter(function(x){return !x.best;});
    if(bestItems.length>0&&TAB!=='전체'){
      contentHtml+='<div class="best-section-hd"><span class="best-badge-label">★ BEST</span><span class="best-count">'+bestItems.length+'개 고정 (상단 10개까지)</span></div>'
        +'<div class="gallery-grid best-grid">'+bestItems.map(function(it){return renderCard(it);}).join('')+'</div>';
      if(regularItems.length>0){
        contentHtml+='<div class="sec-divider"><span>전체 작업물 ('+list.length+'개)</span></div>'
          +'<div class="gallery-grid">'+regularItems.map(function(it){return renderCard(it);}).join('')+'</div>';
      }
    }else{
      contentHtml='<div class="gallery-grid">'+list.map(function(it){return renderCard(it);}).join('')+'</div>';
    }
  }else{
    contentHtml='<div class="empty"><p>🎬</p><span>아직 업로드된 작업물이 없습니다</span><button class="btn btn-primary" onclick="openAddModal()">+ 작업물 추가</button></div>';
  }
  document.getElementById('app').innerHTML='<div class="wrap"><div class="tabs">'+tabsHtml+'</div>'+contentHtml+'</div>';
}

function renderCard(item){
  var isVideo=item.type==='video';
  var vid=isVideo?ytId(item.url):null;
  var thumb='';
  if(item.type==='image'){
    thumb='<img src="'+esc(item.url)+'" alt="'+esc(item.title||'')+'">';
  }else if(vid){
    thumb='<img src="https://img.youtube.com/vi/'+vid+'/mqdefault.jpg" alt="'+esc(item.title||'')+'">';
  }else{
    thumb='<div class="gallery-vbg"><div class="gv-play">▶</div><div class="gv-title">'+esc(item.title||'영상')+'</div></div>';
  }
  var playIcon=isVideo?'<div class="g-play-icon">▶</div>':'';
  var bestBadge=item.best?'<div class="g-best-badge">BEST</div>':'';
  var starCls='g-star'+(item.best?' on':'');
  return '<div class="gallery-item" onclick="openLightbox(\''+esc(item.id)+'\')">'
    +bestBadge+thumb+playIcon
    +'<div class="gallery-overlay">'
    +'<div class="g-title">'+esc(item.title||'제목 없음')+'</div>'
    +'<div class="g-meta">'
    +'<span class="g-cat">'+esc(item.category||'')+'</span>'
    +'<div style="display:flex;gap:5px">'
    +'<button class="'+starCls+'" onclick="event.stopPropagation();toggleBest(\''+esc(item.id)+'\')" title="베스트 고정">★</button>'
    +'<button class="g-edit" onclick="event.stopPropagation();openEditModal(\''+esc(item.id)+'\')" title="수정">✎</button>'
    +'<button class="g-del" onclick="event.stopPropagation();deleteItem(\''+esc(item.id)+'\')">×</button>'
    +'</div></div></div></div>';
}


/* ── SIDEBAR INIT ── */
function initSidebar(){
  var list=document.getElementById('sb-cat-list');
  if(!list)return;
  var CAT_COLORS={'영상/모션2D':'#3a7bd5','영상/모션3D':'#7c3aed','시각편집':'#e8562a','아트웍':'#059669','인테리어':'#d97706','CG/마야':'#dc2626','웹':'#0891b2'};
  CATS.forEach(function(cat){
    if(cat==='전체'){
      var el=document.createElement('div');
      el.className='sb-item'+(TAB===cat?' active':'');
      el.id='sb-cat-전체';
      el.innerHTML='<span class="sb-item-dot" style="background:#94a3b8"></span><span class="sb-item-name">전체</span>';
      el.onclick=function(){setTab('전체');};
      list.appendChild(el);
    }else{
      var el=document.createElement('div');
      el.className='sb-item'+(TAB===cat?' active':'');
      el.id='sb-cat-'+cat;
      el.innerHTML='<span class="sb-item-dot" style="background:'+(CAT_COLORS[cat]||'#3a7bd5')+'"></span><span class="sb-item-name">'+cat+'</span>';
      el.onclick=(function(c){return function(){setTab(c);};})(cat);
      list.appendChild(el);
    }
  });
}

function setTab(t){
  TAB=t;
  document.querySelectorAll('.sb-item').forEach(function(el){
    el.classList.toggle('active',el.id==='sb-cat-'+t);
  });
  renderApp();
}

/* ── ADD MODAL ── */
function openAddModal(){
  UPLOAD_TYPE='image';
  const defaultCat=TAB==='전체'?'영상/모션2D':TAB;
  const catOpts=CATS.filter(c=>c!=='전체').map(c=>'<option value="'+c+'"'+(c===defaultCat?' selected':'')+'>'+c+'</option>').join('');
  const html=''
    +'<div class="modal-hd"><h3>작업물 추가</h3><button class="modal-close" onclick="closeModal()">\u00d7</button></div>'
    +'<div class="modal-body">'
    +'<div class="type-toggle">'
    +'<button class="type-btn active" id="ut-img" onclick="setType(\'image\')">🖼 이미지</button>'
    +'<button class="type-btn" id="ut-vid" onclick="setType(\'video\')">▶ 영상</button>'
    +'</div>'
    +'<div class="field"><label>파일 업로드</label>'
    +'<div class="upload-area" id="ua" onclick="triggerFileInput()">'
    +'<input type="file" id="uf-file" accept="image/*" onchange="onFileSelect(this)">'
    +'<div class="ua-icon">📁</div>'
    +'<div class="ua-text">클릭하여 파일 선택</div>'
    +'<div class="ua-sub">이미지: JPG · PNG · GIF · WEBP&nbsp;&nbsp;|&nbsp;&nbsp;영상: MP4 · MOV</div>'
    +'</div>'
    +'<img id="uf-preview" class="upload-preview" alt="미리보기">'
    +'</div>'
    +'<div class="divider-or">또는</div>'
    +'<div class="field"><label>URL (유튜브 포함)</label><input id="uf-url" placeholder="https://..."></div>'
    +'<div class="field"><label>제목</label><input id="uf-title" placeholder="작품 제목"></div>'
    +'<div class="field"><label>학과 / 카테고리</label><select id="uf-cat">'+catOpts+'</select></div>'
    +'</div>'
    +'<div class="modal-foot">'
    +'<button class="btn btn-outline" onclick="closeModal()">취소</button>'
    +'<button class="btn btn-primary" onclick="saveItem()">추가</button>'
    +'</div>';
  openModal(html);
}

function triggerFileInput(){
  var f=document.getElementById('uf-file');
  if(f)f.click();
}

function setType(t){
  UPLOAD_TYPE=t;
  var img=document.getElementById('ut-img');
  var vid=document.getElementById('ut-vid');
  if(img)img.className='type-btn'+(t==='image'?' active':'');
  if(vid)vid.className='type-btn'+(t==='video'?' active':'');
  var fi=document.getElementById('uf-file');
  if(fi)fi.accept=t==='image'?'image/*':'video/*';
  var p=document.getElementById('uf-preview');
  if(p)p.style.display='none';
  var ua=document.getElementById('ua');
  if(ua){var sub=ua.querySelector('.ua-sub');if(sub)sub.textContent=t==='image'?'JPG · PNG · GIF · WEBP':'MP4 · MOV · WEBM';}
}

function onFileSelect(input){
  if(!input.files||!input.files[0])return;
  var file=input.files[0];
  var ua=document.getElementById('ua');
  if(ua){var txt=ua.querySelector('.ua-text');if(txt)txt.textContent='\u2713 '+file.name;}
  var titleEl=document.getElementById('uf-title');
  if(titleEl&&!titleEl.value)titleEl.value=file.name.replace(/\.[^.]+$/,'');
  if(UPLOAD_TYPE==='image'){
    var reader=new FileReader();
    reader.onload=function(e){var p=document.getElementById('uf-preview');if(p){p.src=e.target.result;p.style.display='block';}};
    reader.readAsDataURL(file);
  }
}

function saveItem(){
  var fileInput=document.getElementById('uf-file');
  var url=(document.getElementById('uf-url').value||'').trim();
  var title=(document.getElementById('uf-title').value||'').trim();
  var category=document.getElementById('uf-cat').value;
  var type=UPLOAD_TYPE;
  if(fileInput&&fileInput.files&&fileInput.files[0]){
    var file=fileInput.files[0];
    var fname=file.name;
    showToast('업로드 중...',60000);
    var fd=new FormData();
    fd.append('file',file);
    fd.append('upload_preset','Portfolio');
    var rt=file.type.startsWith('video/')?'video':'image';
    fetch('https://api.cloudinary.com/v1_1/ditmabkad/'+rt+'/upload',{method:'POST',body:fd})
      .then(function(r){return r.json();})
      .then(function(data){
        if(data.error)throw new Error(data.error.message);
        _commit({id:uid(),type:type,url:data.secure_url,title:title||fname,category:category,addedAt:Date.now()});
      })
      .catch(function(e){showToast('업로드 실패: '+e.message,5000);});
  }else if(url){
    _commit({id:uid(),type:type,url:url,title:title||url,category:category,addedAt:Date.now()});
  }else{
    alert('파일을 선택하거나 URL을 입력하세요.');
  }
}

function _commit(item){
  var d=DB.get();
  if(!d.items)d.items=[];
  d.items.unshift(item);
  DB.save(d);
  closeModal();
  setTab(item.category);
  showToast('추가됨 ✓');
}

function deleteItem(id){
  if(!confirm('이 작업물을 삭제하시겠습니까?'))return;
  var d=DB.get();
  d.items=(d.items||[]).filter(function(x){return x.id!==id;});
  DB.save(d);renderApp();showToast('삭제됨');
}

function toggleBest(id){
  var d=DB.get();
  var item=(d.items||[]).find(function(x){return x.id===id;});
  if(!item)return;
  if(!item.best){
    var cnt=(d.items||[]).filter(function(x){return x.category===item.category&&x.best;}).length;
    if(cnt>=10){showToast('베스트는 학과당 최대 10개입니다',3000);return;}
  }
  item.best=!item.best;
  DB.save(d);renderApp();
  showToast(item.best?'베스트 지정 ★':'베스트 해제');
}

function openEditModal(id){
  var d=DB.get();
  var item=(d.items||[]).find(function(x){return x.id===id;});
  if(!item)return;
  var catOpts=CATS.filter(function(c){return c!=='전체';}).map(function(c){
    return '<option value="'+c+'"'+(c===item.category?' selected':'')+'>'+c+'</option>';
  }).join('');
  var typeLabel=item.type==='video'?'영상 URL (YouTube 포함)':'이미지 URL';
  var html='<div class="modal-hd"><h3>작업물 수정</h3><button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div class="modal-body">'
    +'<div class="field"><label>제목</label><input id="ef-title" value="'+esc(item.title||'')+'"></div>'
    +'<div class="field"><label>'+typeLabel+'</label>'
    +'<input id="ef-url" value="'+esc(item.url||'')+'" placeholder="https://...">'
    +'<div style="font-size:11px;color:var(--sub);margin-top:5px;line-height:1.5">파일로 업로드된 항목은 URL만 변경됩니다. 새 파일을 올리려면 삭제 후 다시 추가하세요.</div>'
    +'</div>'
    +'<div class="field"><label>학과 / 카테고리</label><select id="ef-cat">'+catOpts+'</select></div>'
    +'<div class="field" style="display:flex;align-items:center;gap:10px;padding:8px 0">'
    +'<input type="checkbox" id="ef-best"'+(item.best?' checked':'')+' style="width:18px;height:18px;accent-color:var(--accent);cursor:pointer">'
    +'<label for="ef-best" style="font-size:14px;font-weight:600;color:var(--text);cursor:pointer;text-transform:none;letter-spacing:0;margin:0">베스트 고정 (학과당 최대 10개)</label>'
    +'</div></div>'
    +'<div class="modal-foot">'
    +'<button class="btn btn-outline" onclick="closeModal()">취소</button>'
    +'<button class="btn btn-primary" onclick="saveEdit(\''+esc(id)+'\')">저장</button>'
    +'</div>';
  openModal(html);
}

function saveEdit(id){
  var d=DB.get();
  var item=(d.items||[]).find(function(x){return x.id===id;});
  if(!item)return;
  var newBest=document.getElementById('ef-best').checked;
  if(newBest&&!item.best){
    var cnt=(d.items||[]).filter(function(x){return x.category===item.category&&x.best;}).length;
    if(cnt>=10){showToast('베스트는 학과당 최대 10개입니다',3000);return;}
  }
  item.title=(document.getElementById('ef-title').value||'').trim()||item.title;
  var newUrl=(document.getElementById('ef-url').value||'').trim();
  if(newUrl)item.url=newUrl;
  item.category=document.getElementById('ef-cat').value;
  item.best=newBest;
  DB.save(d);closeModal();renderApp();showToast('수정됨 ✓');
}

/* ── LIGHTBOX ── */
function openLightbox(id){
  var d=DB.get();
  var all=d.items||[];
  var list=TAB==='전체'?all.slice():all.filter(function(x){return x.category===TAB;});
  var best=list.filter(function(x){return x.best;}).slice(0,10);
  var regular=list.filter(function(x){return !x.best;});
  LB_ITEMS=TAB!=='전체'?best.concat(regular):list;
  LB_IDX=LB_ITEMS.findIndex(function(x){return x.id===id;});
  if(LB_IDX<0)LB_IDX=0;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lb-content').innerHTML='';
  document.body.style.overflow='';
}

function lbNav(dir){
  var n=LB_IDX+dir;
  if(n<0||n>=LB_ITEMS.length)return;
  LB_IDX=n;renderLightbox();
}

function renderLightbox(){
  var item=LB_ITEMS[LB_IDX];if(!item)return;
  var content='';
  if(item.type==='image'){
    content='<img src="'+esc(item.url)+'" alt="'+esc(item.title||'')+'">';
  }else{
    var vid=ytId(item.url);
    if(vid)content='<div class="yt-lb"><iframe src="https://www.youtube.com/embed/'+vid+'?autoplay=1" allowfullscreen allow="autoplay" style="width:100%;height:100%;border:none;display:block"></iframe></div>';
    else content='<video src="'+esc(item.url)+'" controls autoplay></video>';
  }
  document.getElementById('lb-content').innerHTML=content;
  document.getElementById('lb-title').textContent=item.title||'';
  document.getElementById('lb-cat').textContent=item.category||'';
  document.getElementById('lb-counter').textContent=(LB_IDX+1)+' / '+LB_ITEMS.length;
  document.getElementById('lb-prev').style.display=LB_IDX>0?'flex':'none';
  document.getElementById('lb-next').style.display=LB_IDX<LB_ITEMS.length-1?'flex':'none';
}

/* ── MODAL ── */
function openModal(html){document.getElementById('modal-box').innerHTML=html;document.getElementById('modal-overlay').classList.add('open');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

document.addEventListener('keydown',function(e){
  if(document.getElementById('lightbox').classList.contains('open')){
    if(e.key==='Escape')closeLightbox();
    if(e.key==='ArrowLeft')lbNav(-1);
    if(e.key==='ArrowRight')lbNav(1);
    return;
  }
  if(e.key==='Escape')closeModal();
});

async function initApp(){
  // 날짜 표시
  var now=new Date();
  var days=['일','월','화','수','목','금','토'];
  var todayEl=document.getElementById('today');
  if(todayEl)todayEl.textContent=now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 ('+days[now.getDay()]+')';

  var overlay=document.getElementById('loading-overlay');
  overlay.style.display='flex';
  try{
    await DB.load();
    overlay.style.display='none';
    initSidebar();
    renderApp();
  }catch(e){
    overlay.innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:36px;margin-bottom:16px">⚠️</div><div style="color:#fff;font-size:18px;font-weight:600;margin-bottom:8px">Firebase 연결 오류</div><div style="color:rgba(255,255,255,.6);font-size:13px;max-width:320px;line-height:1.6">'+e.message+'</div><div style="color:rgba(255,255,255,.4);font-size:12px;margin-top:12px">firebase-config.js 설정을 확인하세요</div></div>';
    console.error(e);
  }
}
initApp();
</script>
